<div>
    {% if title %}<label class="field-label d-block" for="{{ base_id }}">{{ title }}</label>{% endif %}
    <div class="input-group stepper" data-stepper>
        <button type="button" class="btn btn-outline-secondary" data-step="-1" aria-label="Decrease">{% include "icons/dash.html" %}</button>
        <input class="form-control" type="number" step="{{ step }}" id="{{ base_id }}" value="0.00" min="-100" max="100" data-decimals="2">
        <button type="button" class="btn btn-outline-secondary" data-step="1" aria-label="Increase">{% include "icons/plus.html" %}</button>
    </div>
</div>
