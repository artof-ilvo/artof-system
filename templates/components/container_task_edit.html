<div class="section">
    <div class="d-flex gap-2">
        <div class="flex-grow-1">
            {% include "components/button_collapse.html" with title=task.name base_id=task.name %}
        </div>
        <form method="GET" action="{% url 'core:field_edit_task_remove' %}" class="m-0" data-field-name-form data-confirm="Remove task “{{ task.name }}” from this field?" data-confirm-label="Remove">
            <input type="hidden" name="field_name" value="{{ field_name }}">
            <input type="hidden" name="task_name" value="{{ task.name }}">
            <button class="btn btn-ghost text-danger btn-icon h-100" type="submit" title="Remove task" aria-label="Remove task {{ task.name }}">{% include "icons/trash.html" %}</button>
        </form>
    </div>
    <form class="collapse" id="collapse-{{ task.name }}" method="POST" action="{% url 'core:field_edit_task' %}">
        {% csrf_token %}
        <div class="section-body stack">
            <div class="row g-2">
                <div class="col-sm-4">
                    <label for="hitch-{{ task.name }}" class="field-label d-block">Hitch</label>
                    <select id="hitch-{{ task.name }}" class="form-select" data-task="{{ task.name }}" data-task-property="hitch">
                        {% for key, value in hitch_choices %}
                            <option value="{{ value }}" {% if value == task.hitch %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-4">
                    <label for="type-{{ task.name }}" class="field-label d-block">Type</label>
                    <select id="type-{{ task.name }}" class="form-select" data-task="{{ task.name }}" data-task-property="type">
                        {% for key, value in type_choices %}
                            <option value="{{ value }}" {% if key == task.type %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-sm-4">
                    <label for="implement-{{ task.name }}" class="field-label d-block">Implement</label>
                    <select id="implement-{{ task.name }}" class="form-select" data-task="{{ task.name }}" data-task-property="implement">
                        {% for key, value in implement_choices %}
                            <option value="{{ value }}" {% if key == task.implement %}selected{% endif %}>{{ value }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="task-attribute" data-task-attribute="{{ task.name }}" data-url="{% url 'core:field_edit_task_attribute' %}" hidden></div>
            {% include "components/container_field_edit.html" with base_id=task.name %}
        </div>
    </form>
</div>
