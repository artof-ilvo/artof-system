<div class="setting-row">
    <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
        <label class="setting-label" for="{{ base_id }}-slider">{{ name }}</label>
        <span class="d-inline-flex align-items-center gap-1">
            <span id="{{ base_id }}-label" class="value-badge">{{ initial_value }}</span>
            {% if unit %}<span class="small text-body-secondary">{{ unit }}</span>{% endif %}
        </span>
    </div>
    <input type="range" id="{{ base_id }}-slider" name="{{ base_id }}" value="{{ initial_value }}" class="form-range" step="{{ step }}" min="{{ min_value }}" max="{{ max_value }}"
           data-label="{{ base_id }}-label" data-autosubmit>
    <div class="d-flex justify-content-between small text-body-secondary">
        <span>{{ min_value }} {{ unit }}</span>
        <span>{{ max_value }} {{ unit }}</span>
    </div>
</div>
