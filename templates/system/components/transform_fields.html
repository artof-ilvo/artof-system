{# T [x, y, z] (m) and R [roll, pitch, yaw] (deg) inputs of a transform at `prefix`. #}
{# relative=True binds them with data-key (inside a list item) instead of data-path. #}
<span class="field-label d-block">{{ label }} T (m)</span>
<div class="input-group">
  <span class="input-group-text">x</span><input type="number" class="form-control" {% if relative %}data-key{% else %}data-path{% endif %}="{{ prefix }}.T.0" data-type="number" step="0.001" data-preview="{{ preview }}" aria-label="{{ label }} x">
  <span class="input-group-text">y</span><input type="number" class="form-control" {% if relative %}data-key{% else %}data-path{% endif %}="{{ prefix }}.T.1" data-type="number" step="0.001" data-preview="{{ preview }}" aria-label="{{ label }} y">
  <span class="input-group-text">z</span><input type="number" class="form-control" {% if relative %}data-key{% else %}data-path{% endif %}="{{ prefix }}.T.2" data-type="number" step="0.001" data-preview="{{ preview }}" aria-label="{{ label }} z">
</div>
<span class="field-label d-block mt-2">{{ label }} R (°)</span>
<div class="input-group">
  <span class="input-group-text">roll</span><input type="number" class="form-control" {% if relative %}data-key{% else %}data-path{% endif %}="{{ prefix }}.R.0" data-type="number" step="0.1" data-preview="{{ preview }}" aria-label="{{ label }} roll">
  <span class="input-group-text">pitch</span><input type="number" class="form-control" {% if relative %}data-key{% else %}data-path{% endif %}="{{ prefix }}.R.1" data-type="number" step="0.1" data-preview="{{ preview }}" aria-label="{{ label }} pitch">
  <span class="input-group-text">yaw</span><input type="number" class="form-control" {% if relative %}data-key{% else %}data-path{% endif %}="{{ prefix }}.R.2" data-type="number" step="0.1" data-preview="{{ preview }}" aria-label="{{ label }} yaw">
</div>
