<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Robot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Lichte, rustige achtergrondkleur */
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card login-card shadow-lg p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">Artof System</h2>
            <p class="text-muted">Please log in to access the control panel</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                Username or password is wrong, please try again.
            </div>
        {% endif %}

        <form method="POST" action="{% url 'system:login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username" required autofocus>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Log in</button>
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>

</body>
</html>
