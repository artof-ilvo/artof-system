{% extends "system/base.html" %}
{% load static %}
{% block title %}Editor{% endblock %}
{% block content %}

<form method="POST" action="edit" id="editor-form" class="card" data-busy>
  {% csrf_token %}
  <div class="card-header d-flex flex-wrap align-items-center gap-2">
    <button type="button" class="btn btn-ghost btn-icon" id="back-button" title="Back" aria-label="Back">
      {% include "icons/arrow-left-short.html" %}
    </button>
    <input type="text" name="name" value="{{ Name }}" id="editor-job-name" class="file-name-input flex-grow-1" aria-label="Name">
    <button id="formatBtn" type="button" class="btn btn-outline-secondary">{% include "icons/json.html" %} Format</button>
    <button id="submitBtn" type="submit" class="btn btn-primary">{% include "icons/box-arrow-in-up.html" %} Save</button>
  </div>
  <div class="code-editor">
    <div class="code-gutter" id="line-numbers-container">
      <div id="line-numbers"></div>
    </div>
    <textarea name="data" id="json-editor" spellcheck="false" aria-label="JSON">{{ Json }}</textarea>
  </div>
</form>

<script type="module" src="{% static 'js/pages/editor.js' %}"></script>

{% endblock %}
