<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>{% block title %}ARTOF{% endblock %}</title>

    <!-- Favicon and Apple Touch Icon -->
    <link rel="apple-touch-icon" href="https://ilvo.vlaanderen.be/assets/dist/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://ilvo.vlaanderen.be/assets/dist/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://ilvo.vlaanderen.be/assets/dist/img/favicons/favicon-16x16.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <script type="module" src="{% static 'js/pages/system-base.js' %}"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
      <a class="navbar-brand" href="#">Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'system:settings' %}">Settings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'system:implement' %}">Implements</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'system:process' %}">Processes</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'system:addon' %}">Addons</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'system:monitor' %}">Monitor</a>
          </li>
        </ul>
        <div class="my-2 my-lg-0 ms-auto">
          <a class="nav-link" href="{% url 'core:field' %}">App</a>
        </div>
      </div>
    </nav>

    <div class="container-fluid pr-3 pl-3">{% block content %} {% endblock %}</div>

    <div class="d-flex justify-content-center toast-container-fixed">
      <div class="toast" role="alert" aria-live="assertive" aria-atomic="true" id="robot-toast" data-acknowledge-url="{% url 'core:notification_acknowledge' %}">
        <div class="toast-header">
          <img src="https://ilvo.vlaanderen.be/assets/dist/img/favicons/favicon-32x32.png" class="rounded me-2" alt="ILVO">
          <strong class="me-auto">{{ robot_name }}</strong>
          <small class="text-muted">Just now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body"></div>
      </div>
    </div>
  </body>
</html>
