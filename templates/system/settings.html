{% extends "system/base.html" %} {% block title %}Settings{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1>Settings</h1>
    <p class="page-subtitle">Configuration files of the robot.</p>
  </div>
</div>

<div class="card">
  <div class="list-group list-group-flush">
    <form method="GET" action="{% url 'system:edit_settings' %}" class="list-group-item d-flex align-items-center gap-3 py-3" data-busy>
      <div class="flex-grow-1">
        <div class="fw-semibold">System settings</div>
        <div class="small text-body-secondary font-monospace">settings.json</div>
      </div>
      <button type="submit" class="btn btn-outline-primary" name="filename" value="settings.json">{% include "icons/pen.html" %} Edit</button>
    </form>
    <form method="GET" action="{% url 'system:edit_settings' %}" class="list-group-item d-flex align-items-center gap-3 py-3" data-busy>
      <div class="flex-grow-1">
        <div class="fw-semibold">Redis configuration</div>
        <div class="small text-body-secondary font-monospace">config.json</div>
      </div>
      <button type="submit" class="btn btn-outline-primary" name="filename" value="config.json">{% include "icons/pen.html" %} Edit</button>
    </form>
    <form method="GET" action="{% url 'system:edit_settings' %}" class="list-group-item d-flex align-items-center gap-3 py-3" data-busy>
      <div class="flex-grow-1">
        <div class="fw-semibold">Types</div>
        <div class="small text-body-secondary font-monospace">types.json</div>
      </div>
      <button type="submit" class="btn btn-outline-primary" name="filename" value="types.json">{% include "icons/pen.html" %} Edit</button>
    </form>
  </div>
</div>

{% endblock %}
